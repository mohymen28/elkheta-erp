services:
  - type: web
    name: elkheta-erp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: elkheta-erp-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://elkheta-erp.vercel.app

databases:
  - name: elkheta-erp-db
    plan: free
    databaseName: elkheta_erp
    user: elkheta_admin
