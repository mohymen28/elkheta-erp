services:
  - type: web
    name: elkheta-erp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run db:generate
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elkheta-erp-db
          property: connectionString
      - key: PORT
        value: 5000

databases:
  - name: elkheta-erp-db
    plan: free
    databaseName: elkheta_erp
    user: elkheta_admin
